<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="become">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preload" href="splash-390x844.png" as="image">
<link rel="apple-touch-startup-image" href="splash-390x844.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<title>become</title>
<style>
/*
VOICE: 조용하고 짧게. 한 화면에 하나의 행동.
IDEA: 출석 도장 카드 — 한 칸이 실제로 간 하루.
PICTURE: 오늘 화면의 큰 목표와 숫자, 기록 화면의 누적 칸.
COLOUR and TYPE: 흰 바탕, 아이콘에서 가져온 초록 하나, 시스템 서체.
LAYOUT: 위에 정보, 엄지가 닿는 아래에 버튼.
*/
:root{
  color-scheme:light dark;
  --primary:light-dark(#1ED686,#2EE099);
  --primary-press:light-dark(#14BF74,#22C98A);
  --primary-soft:light-dark(#E6F9EF,#0F2A20);
  --primary-ink:light-dark(#07784A,#5EE8AF);
  --on-primary:light-dark(#05301E,#04261A);
  --text:light-dark(#1A1D23,#F2F4F6);
  --sub:light-dark(#6E7580,#9AA1AB);
  --faint:light-dark(#A3A9B2,#5F6670);
  --surface:light-dark(#F3F5F7,#1C1D21);
  --bg:light-dark(#FFFFFF,#000000);
  --line:light-dark(#E6E9ED,#2A2C31);
  --rest:light-dark(#D3D8DE,#4A4E56);
  --empty:light-dark(#EEF0F3,#1C1D21);
  --sheet:light-dark(#FFFFFF,#1C1D21);
  --scrim:light-dark(rgba(0,0,0,.35),rgba(0,0,0,.6));
}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
/* 시작 화면: 아이콘이 잠깐 보였다가 앱 화면으로 넘어감. 자바스크립트 없이 CSS만으로 사라짐 */
#splash{position:fixed;inset:0;z-index:100;pointer-events:none;background:#fff url(splash-390x844.png) center/cover no-repeat;transform-origin:50% 45%;animation:splashout .9s ease-in-out .8s forwards}
/* 아이폰이 앱을 켤 때 보여주는 시작 이미지와 '같은 그림 파일'을 그대로 깔아서, 아이콘 위치가 한 치도 어긋나지 않게 함 */
@keyframes splashout{to{opacity:0;visibility:hidden;transform:scale(1.06)}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);touch-action:manipulation}
body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;overflow-x:clip;word-break:keep-all;overflow-wrap:break-word}
button,input{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
.app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 8px) 24px 20px}
.view{display:none;min-height:100%;flex-direction:column}
.view.active{display:flex}
.top{display:flex;justify-content:space-between;align-items:center;height:48px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.3px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--sub);margin-right:-10px}
.iconbtn:active{background:var(--surface)}
.date{font-size:15px;color:var(--sub)}
.label{font-size:15px;color:var(--sub);margin:0}
.goal{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:6px 0 0;line-height:1.25;text-wrap:balance}
.card{background:var(--surface);border-radius:20px;padding:20px}
.big{font-size:clamp(40px,12vw,52px);font-weight:700;letter-spacing:-1px;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:.5em;font-weight:600;margin-left:2px}
.hint{font-size:14px;color:var(--sub);margin:8px 0 0}
.mine{font-size:15px;color:var(--primary-ink);font-weight:600;margin:10px 0 0}
.spacer{flex:1;min-height:24px}
.state{text-align:center;padding:8px 0 24px}
.state .mark{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-ink)}
.state .mark.rest{background:var(--surface);color:var(--sub)}
.state h2{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0;line-height:1.3;text-wrap:balance}
.state p{font-size:15px;color:var(--sub);margin:8px 0 0}
.btns{display:grid;gap:10px}
.btn{height:56px;border-radius:16px;font-size:17px;font-weight:600;width:100%;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:active{background:var(--primary-press)}
.btn.secondary{background:var(--primary-soft);color:var(--primary-ink)}
.btn.plain{background:var(--surface);color:var(--text)}
.btn.text{height:44px;color:var(--sub);font-weight:500;font-size:15px}
.btn.danger{background:var(--surface);color:#E5484D}
.btn:focus-visible,.iconbtn:focus-visible,.tab:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.hapbtn{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none}
.hapbtn:has(.hap:focus-visible){outline:3px solid var(--primary);outline-offset:2px}
.hap{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:.02;cursor:pointer}
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;max-width:300px;margin:4px auto 20px}
.strip i{aspect-ratio:1;border-radius:6px;background:var(--empty)}
.strip i.on{background:var(--primary)}
.strip i.new{animation:cellin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes cellin{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
/* 기분 날씨 */
.wxbox{width:112px;height:112px;margin:0 auto 12px;animation:wxin .5s cubic-bezier(.2,1.3,.4,1)}
.wxbox svg{width:100%;height:100%;display:block;overflow:visible}
@keyframes wxin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.wx-sun{fill:#FFC23D}
.wx-ray{stroke:#FFC23D;stroke-width:5;stroke-linecap:round}
.wx-rays{transform-origin:60px 60px;transform-box:view-box;animation:wxspin 14s linear infinite}
.wx-core{transform-origin:60px 60px;transform-box:view-box;animation:wxpulse 2.6s ease-in-out infinite}
.wx-glow{fill:#FFC23D;opacity:.22;transform-origin:60px 60px;transform-box:view-box;animation:wxglow 2.6s ease-in-out infinite}
.wx-spark{fill:#FFC23D;transform-box:fill-box;transform-origin:center;animation:wxtwinkle 1.8s ease-in-out infinite}
.wx-cloud{fill:light-dark(#D3DAE2,#5A626C);animation:wxdrift 4s ease-in-out infinite}
.wx-cloud.back{fill:light-dark(#E4E9EE,#454C55);animation-duration:5.5s;animation-direction:reverse}
.wx-cloud.dark{fill:light-dark(#A5AFBB,#4A515A)}
.wx-drop{stroke:#4FA8E8;stroke-width:4;stroke-linecap:round;animation:wxrain 1.1s linear infinite}
.wx-sun-small .wx-rays,.wx-sun-small .wx-core{transform-origin:44px 46px}
@keyframes wxspin{to{transform:rotate(360deg)}}
@keyframes wxpulse{50%{transform:scale(1.06)}}
@keyframes wxglow{0%,100%{transform:scale(.9);opacity:.15}50%{transform:scale(1.12);opacity:.3}}
@keyframes wxtwinkle{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes wxdrift{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes wxrain{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(20px);opacity:0}}
/* 다시 시작하는 힘 */
.cb-title{margin:0 0 12px;font-size:17px;font-weight:700;color:var(--text);text-wrap:balance}
.cb-line{margin:0;font-size:15px;color:var(--text);line-height:1.5}
.cb-line+.cb-line{margin-top:6px}
.cb-line.accent{color:var(--primary-ink);font-weight:600}
.cb-hint{margin:12px 0 0;font-size:13px;color:var(--sub);line-height:1.5}
.cb-row{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;align-items:center;gap:10px;margin-top:10px;font-size:14px;color:var(--sub)}
.cb-row b{color:var(--text);font-variant-numeric:tabular-nums;white-space:nowrap}
.cb-track{height:12px}
.cb-bar{height:100%;border-radius:6px;background:var(--rest)}
.cb-row.now .cb-bar{background:var(--primary)}
.cb-row.now span{color:var(--text);font-weight:600}
/* 쌓인 칸 */
.cell.next{background:transparent;border:1.5px dashed color-mix(in srgb,var(--primary-ink) 50%,transparent)}
button.cell{border:0;padding:0;cursor:pointer;position:relative}
/* 가기 싫었는데 간 날: 앱 아이콘처럼 번지는 초록 + 가끔 스치는 빛 */
.cell.tough,.strip i.tough{background:linear-gradient(135deg,#C2FAD6 0%,#5BE6A2 45%,#0BBE70 100%)!important;position:relative;overflow:hidden}
.cell.tough::after,.strip i.tough::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.8) 50%,transparent 70%);transform:translateX(-130%);animation:shine 7s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes shine{0%,78%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.cell.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.cell-detail{margin-top:14px;background:var(--surface);border-radius:14px;padding:14px 16px;min-height:52px}
.cd-hint{margin:0;font-size:14px;color:var(--sub)}
.cd-title{margin:0 0 6px;font-size:16px;font-weight:700}
.cd-line{margin:0;font-size:15px;color:var(--text);line-height:1.6}
.textrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}
.mood-q{margin:22px 0 0!important;color:var(--text)!important;font-weight:600}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.mood{min-height:52px;border-radius:12px;background:var(--surface);color:var(--sub);font-size:13px;line-height:1.2;padding:4px 2px;word-break:keep-all}
.mood[aria-pressed=true]{background:var(--primary);color:var(--on-primary);font-weight:600}
.mood:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.mood-note{font-size:13px!important;color:var(--faint)!important}
.opt{text-align:left;padding:0 20px}
.wrap{background:var(--surface);border-radius:16px;padding:16px;margin-top:14px;text-align:left}
.ba{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ba-item{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px}
.ba-label{display:block;font-size:12px;color:var(--faint)}
.ba-val{display:block;font-size:15px;font-weight:600;color:var(--sub);margin-top:2px}
.ba-val.on{color:var(--primary-ink)}
.ba-arrow{color:var(--faint);font-size:18px}
.state .wrap-msg{margin:0;font-size:16px;font-weight:600;color:var(--text);line-height:1.45}
.state .wrap-stat{margin:6px 0 0;font-size:14px;color:var(--sub)}
.sheet .lead{font-size:15px;color:var(--sub);margin:-12px 0 0}
.evidence{background:var(--primary-soft);border-radius:16px;padding:14px 16px;margin-top:20px}
.evidence p{margin:0;color:var(--primary-ink);font-weight:600;font-size:15px}
.evidence p+p{margin-top:6px}
.help-time{margin-top:20px}
.help-main{margin-top:24px!important}
.help-foot{margin-top:8px!important}
.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

/* 기록 */
h1.title{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0}
.sec{margin-top:28px}
.sec h3{font-size:17px;font-weight:700;margin:0 0 12px}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.chip{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--sub)}
.chip b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;border-radius:6px;background:var(--empty)}
.cell.on{background:var(--primary)}
.cell.new{animation:pop .45s ease-out}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-head b{font-size:17px}
.cal-nav{display:flex}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.cal .wd{font-size:12px;color:var(--faint);padding-bottom:2px}
.day{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:14px;background:var(--empty);color:var(--sub);font-variant-numeric:tabular-nums}
.day.attend{background:var(--primary);color:var(--on-primary);font-weight:600}
.day.rest{background:var(--rest);color:var(--text)}
.day.today{box-shadow:inset 0 0 0 2px var(--text)}
.day.blank{background:none}
button.day{border:0;font:inherit;font-size:14px;font-weight:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.day.attend{font-weight:600}
.day.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--primary-ink)}
.day-detail{margin-top:12px}
.day-detail .btn{margin-top:10px}
.cal-tip{margin-top:10px}
.legend{display:flex;gap:14px;margin-top:12px;font-size:13px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.note{margin-top:20px;font-size:14px;color:var(--sub);background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.note button{color:var(--primary-ink);font-weight:600;font-size:14px;min-height:44px;white-space:nowrap}

/* 하단 탭 */
nav{display:flex;border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--faint)}
.tab.active{color:var(--text)}
.tab svg{width:24px;height:24px}

/* 시트 */
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--sheet);border-radius:24px 24px 0 0;padding:12px 24px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .25s ease-out;z-index:11;max-height:90%;overflow-y:auto}
.sheet.open{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:22px;margin:0 0 20px;letter-spacing:-.3px}
.field label{font-size:14px;color:var(--sub);display:block;margin-bottom:6px}
.field input{width:100%;height:52px;border-radius:14px;border:0;background:var(--surface);padding:0 16px;font-size:17px}
.field input:focus{outline:2px solid var(--primary)}
.group{margin-top:24px}
.group .glabel{font-size:14px;color:var(--sub);margin-bottom:8px}
.sheet .btns{margin-top:10px}
.muted{font-size:13px;color:var(--faint);margin:10px 0 0;line-height:1.5}
textarea{width:100%;height:120px;border-radius:14px;border:0;background:var(--surface);padding:12px;font:13px/1.4 ui-monospace,Menlo,monospace;color:var(--text);margin-top:10px;resize:none}

/* 토스트 */
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 72px);max-width:448px;margin:0 auto;background:light-dark(#1A1D23,#2C2E33);color:#fff;border-radius:14px;padding:0 8px 0 16px;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast{touch-action:none}
.toast button{color:#7BE8B8;font-weight:600;min-height:44px;padding:0 10px;white-space:nowrap}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash{display:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"></div>
<div class="app">
<main>
  <!-- 오늘 -->
  <section class="view active" id="v-today" aria-label="오늘">
    <div class="top">
      <span class="brand">become.</span>
      <button class="iconbtn" id="open-settings" aria-label="설정">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="date" id="today-date"></div>

    <div style="margin-top:28px">
      <p class="label">오늘의 목표</p>
      <p class="goal" id="goal-name"></p>
    </div>

    <div class="card" style="margin-top:24px">
      <p class="label">지금까지 쌓은 출석</p>
      <div class="big" id="today-count" style="margin-top:4px"></div>
      <p class="mine" id="reluctant-line" hidden></p>
    </div>

    <div class="spacer"></div>
    <div class="state" id="state"></div>
    <div class="btns" id="actions"></div>
  </section>

  <!-- 기록 -->
  <section class="view" id="v-record" aria-label="기록">
    <div class="top"><h1 class="title">기록</h1></div>

    <div class="card" style="margin-top:12px">
      <p class="label">지금까지 쌓은 출석</p>
      <div class="big" id="rec-count" style="margin-top:4px"></div>
      <div class="row" id="rec-chips"></div>
    </div>

    <div class="sec">
      <h3>쌓인 칸</h3>
      <div class="cells" id="cells"></div>
      <div class="cell-detail" id="cell-detail"></div>
    </div>

    <div class="sec">
      <h3>다시 시작하는 힘</h3>
      <div class="card" id="comeback"></div>
    </div>

    <div class="sec">
      <div class="cal-head">
        <b id="cal-title"></b>
        <div class="cal-nav">
          <button class="iconbtn" id="cal-prev" aria-label="이전 달" style="margin-right:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="iconbtn" id="cal-next" aria-label="다음 달"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>
      <div class="cal" id="cal"></div>
      <div class="card day-detail" id="day-detail" hidden></div>
      <div class="legend">
        <span><i style="background:var(--primary)"></i>출석</span>
        <span><i style="background:var(--rest)"></i>쉬기로 한 날</span>
        <span><i style="background:var(--empty)"></i>기록 없음</span>
      </div>

<script>
{
const KEY = 'become.v1';
const $ = (id) => document.getElementById(id);
const fresh = () => ({ version: 1, goal: '헬스장 가기', records: {}, help: {}, lastBackup: null });

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && typeof d.records === 'object') {
        const s = Object.assign(fresh(), d);
        if (!s.help || typeof s.help !== 'object') s.help = {};
        return s;
      }
    }
  } catch (e) {}
  return fresh();
}
let state = load();
let storageOk = true;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

// 날짜: 밤 12시 기준, 도착 시각이 속한 날로 기록
const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayKey = () => keyOf(new Date());
// 앱 버전: 올릴 때마다 sw.js의 CACHE 번호와 같이 올린다
const APP_VERSION = 21;
$('app-ver').textContent = '버전 ' + APP_VERSION;
// 밤 12시를 넘겨 운동하는 날: 어제 도착해서 아직 끝내지 않았다면 '오늘' 화면에서도 그 기록을 이어서 보여준다.
// 기록의 날짜는 도착한 날 그대로 두고, 화면만 이어 준다.
const CARRY_OPEN = 6 * 3600e3; // 도착한 뒤 6시간까지는 '운동 끝났어요'를 누를 수 있음
const CARRY_DONE = 2 * 3600e3; // 자정 이후에 끝냈다면 2시간까지는 기분을 남길 수 있음
function activeKey() {
  const tk = todayKey();
  if (state.records[tk]) return tk;
  const d = new Date();
  const now = d.getTime();
  const midnight = d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - 1);
  const pk = keyOf(d);
  const p = state.records[pk];
  if (p && p.status === 'attend' && p.arrivedAt > 1e11) {
    if (!p.finishedAt && now - p.arrivedAt < CARRY_OPEN) return pk;
    if (p.finishedAt >= midnight && now - p.finishedAt < CARRY_DONE) return pk;
  }
  return tk;
}
const timeOf = (ms) => new Date(ms).toLocaleTimeString('ko-KR', { hour: 'numeric', minute: '2-digit' });
function duration(a, b) {
  const m = Math.max(1, Math.round((b - a) / 60000));
  return m >= 60 ? Math.floor(m / 60) + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : '') : m + '분';
}
const recs = () => Object.entries(state.records);
const attendCount = () => recs().filter(([, r]) => r.status === 'attend').length;
const reluctantCount = () => recs().filter(([, r]) => r.status === 'attend' && r.reluctant).length;
const monthCount = (y, m) => recs().filter(([k, r]) => r.status === 'attend' && k.startsWith(y + '-' + pad(m + 1))).length;

const MOODS = ['나쁨', '별로', '보통', '좋음', '매우 좋음'];
const REASONS = {
  out: { ask: '밖에 나가기 싫어요', past: '나가기 싫다고 한 날에도' },
  burden: { ask: '운동이 부담스러워요', past: '운동이 부담된다고 한 날에도' },
  tired: { ask: '너무 피곤해요', past: '피곤하다고 한 날에도' },
  later: { ask: '조금 이따 갈래요', past: '미루고 싶었던 날에도' },
};
const attended = (k) => (state.records[k] || {}).status === 'attend';
const reasonCount = (reason) =>
  Object.entries(state.help).filter(([k, h]) => h && h.reason === reason && attended(k)).length;

// 과거의 나: 실제로 남긴 기록으로만 문장을 만든다. 기록이 없으면 아무것도 보여주지 않는다.
function pastLines(reason) {
  const out = [];
  const tk = todayKey();
  if (reason) {
    const n = reasonCount(reason);
    if (n) out.push(REASONS[reason].past + ' ' + n + '번 다녀왔어요.');
  }
  const rel = reluctantCount();
  if (rel) out.push('가기 싫었던 날에도 ' + rel + '번 해냈어요.');
  const relMood = recs().filter(([, r]) => r.status === 'attend' && r.reluctant && r.mood);
  const good = relMood.filter(([, r]) => r.mood >= 4).length;
  if (good) out.push('가기 싫었던 날 다녀온 뒤 ' + relMood.length + '번 중 ' + good + '번은 기분이 좋았어요.');
  if (!reason) {
    for (const key of Object.keys(REASONS)) {
      const n = reasonCount(key);
      if (n) out.push(REASONS[key].past + ' ' + n + '번 다녀왔어요.');
    }
    const last = recs()
      .filter(([k, r]) => k < tk && r.status === 'attend' && r.mood)
      .sort(([a], [b]) => (a < b ? 1 : -1))[0];
    if (last && last[1].mood >= 4) out.push("지난번 다녀온 뒤 기분은 '" + MOODS[last[1].mood - 1] + "'이었어요.");
    const cb = comebackStats();
    if (cb.compare && cb.compare.better) {
      out.push('다시 시작하는 데 걸리는 시간이 평균 ' + fmtDays(cb.compare.before) + '에서 ' + fmtDays(cb.compare.now) + '로 줄었어요.');
    }
  }
  return out;
}
// ---- 다시 시작하는 힘 ----
// 출석과 다음 출석 사이가 3일 이상 벌어졌다면 '쉬었다가 다시 시작한 것'으로 본다.
// (하루 걸러 가는 건 쉬는 게 아니라 평소 리듬이라서 제외)
// 예: 20일에 가고 24일에 갔다면 '4일 만에 다시 시작'.
const COMEBACK_MIN = 3;
const dayNum = (k) => Math.round(Date.UTC(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10)) / 864e5);
const attendDays = () => recs().filter(([, r]) => r.status === 'attend').map(([k]) => k).sort();
const fmtDays = (v) => String(Math.round(v * 10) / 10) + '일';
function comebacks() {
  const d = attendDays();
  const out = [];
  for (let i = 1; i < d.length; i++) {
    const g = dayNum(d[i]) - dayNum(d[i - 1]);
    if (g >= COMEBACK_MIN) out.push({ key: d[i], days: g });
  }
  return out;
}
function comebackStats() {
  const list = comebacks();
  const days = attendDays();
  const res = {
    list,
    last: list.length ? list[list.length - 1] : null,
    fastest: list.length ? Math.min(...list.map((x) => x.days)) : null,
    compare: null,
  };
  // 짧은 기간끼리 비교하지 않음: 다시 시작한 기록 4번 이상 + 첫 출석 후 4주 이상
  const spanOk = days.length > 0 && dayNum(todayKey()) - dayNum(days[0]) >= 28;
  if (list.length >= 4 && spanOk) {
    const k = Math.min(5, Math.floor(list.length / 2));
    const avg = (arr) => arr.reduce((sum, x) => sum + x.days, 0) / arr.length;
    const before = avg(list.slice(0, k));
    const now = avg(list.slice(-k));
    res.compare = { before, now, k, better: now <= before - 0.5 };
  }
  return res;
}
// 오늘 아직 안 갔고 쉬기도 안 눌렀을 때, 오늘 가면 며칠 만인지
function gapToday() {
  const tk = todayKey();
  if (state.records[tk] || activeKey() !== tk) return 0;
  const d = attendDays().filter((k) => k < tk);
  if (!d.length) return 0;
  const g = dayNum(tk) - dayNum(d[d.length - 1]);
  return g >= COMEBACK_MIN ? g : 0;
}

function planLabel(t) {
  const [hh, mm] = t.split(':').map(Number);
  const d = new Date();
  d.setHours(hh, mm, 0, 0);
  return timeOf(d.getTime());
}
function planPassed(t) {
  const [hh, mm] = t.split(':').map(Number);
  const now = new Date();
  return now.getHours() * 60 + now.getMinutes() >= hh * 60 + mm;
}

// 진동
// 안드로이드: 표준 진동 기능.
// 아이폰: 웹에는 진동 기능이 없음. 예전에는 숨긴 스위치를 코드로 눌러 진동을 냈지만
// iOS 26.5에서 막힘. 그래서 버튼 위에 거의 투명한 실제 스위치를 덮어,
// 손가락이 스위치를 직접 누르게 함 (실험적 방법).
function haptic() {
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
}

// 되돌리기
let toastTimer, undoFn = null;
function toast(msg, undo) {
  $('toast').style.transform = '';
  $('toast').style.opacity = '';
  $('toast-msg').textContent = msg;
  undoFn = undo || null;
  $('toast-undo').hidden = !undo;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('toast').classList.remove('show'); undoFn = null; }, 5000);
}
$('toast-undo').addEventListener('click', () => {
  if (undoFn) undoFn();
  undoFn = null;
  $('toast').classList.remove('show');
});
// 알림 바를 아래로 쓸어내리면 닫힘
{
  const t = $('toast');
  let startY = null, dy = 0;
  t.addEventListener('touchstart', (e) => {
    startY = e.touches[0].clientY;
    dy = 0;
    t.style.transition = 'none';
  }, { passive: true });
  t.addEventListener('touchmove', (e) => {
    if (startY === null) return;
    dy = Math.max(0, e.touches[0].clientY - startY);
    t.style.transform = 'translateY(' + dy + 'px)';
    t.style.opacity = String(Math.max(0.2, 1 - dy / 100));
  }, { passive: true });
  const end = () => {
    if (startY === null) return;
    startY = null;
    t.style.transition = '';
    if (dy > 24) {
      clearTimeout(toastTimer);
      undoFn = null;
      t.style.transform = 'translateY(100px)';
      t.style.opacity = '0';
      setTimeout(() => { t.classList.remove('show'); t.style.transform = ''; t.style.opacity = ''; }, 200);
    } else {
      t.style.transform = '';
      t.style.opacity = '';
    }
  };
  t.addEventListener('touchend', end);
  t.addEventListener('touchcancel', end);
}

// 오늘의 기록(출석·쉬기)과 도움 기록을 함께 바꾸고, 되돌리기를 제공
function change(mutate, msg, animate = true, key) {
  const k = key || activeKey();
  const snap = (o) => (o ? JSON.parse(JSON.stringify(o)) : null);
  const beforeRec = snap(state.records[k]);
  const beforeHelp = snap(state.help[k]);
  mutate(k);
  save();
  render(animate);
  if (!storageOk) { toast('저장하지 못했어요. 백업을 먼저 해 주세요.'); return; }
  if (!msg) return;
  toast(msg, () => {
    if (beforeRec) state.records[k] = beforeRec; else delete state.records[k];
    if (beforeHelp) state.help[k] = beforeHelp; else delete state.help[k];
    save();
    render();
  });
}

// 되돌리기 알림은 기록을 지우는 동작에만 띄운다. 도착·끝·쉬기처럼 앞으로 가는 동작은 화면이 바뀌는 것으로 충분하고,
// 잘못 눌렀다면 화면에 있는 '도착 취소'·'끝 기록 취소'·'그래도 가볼래요'로 되돌릴 수 있다.
const actions = {
  arrive: (reluctant) => {
    change((k) => {
      // '가기 싫어요'를 거쳐 온 날은 자동으로 '가기 싫었던 날'로 기록
      state.records[k] = { status: 'attend', arrivedAt: Date.now(), reluctant: !!reluctant || !!state.help[k] };
    }, null);
  },
  mood: (v, key) => change((k) => {
    const r = state.records[k];
    if (!r) return;
    if (r.mood === v) delete r.mood; else r.mood = v;
  }, null, false, key),
  finish: (key) => {
    change((k) => { const r = state.records[k]; if (r && r.status === 'attend') r.finishedAt = Date.now(); }, null, true, key);
  },
  rest: () => change((k) => { state.records[k] = { status: 'rest', at: Date.now() }; }, null),
  clearToday: (msg, key) => change((k) => { delete state.records[k]; }, msg, true, key),
  unfinish: (key) => change((k) => { if (state.records[k]) delete state.records[k].finishedAt; }, '끝 기록을 지웠어요', true, key),
};

const ICON_CHECK = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_MOON = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const ICON_CLOCK = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>';
const ICON_STEP = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>';

// '가기 싫어요'에서 정한 것을 오늘 화면에 보여줄 문구
function committedView(h) {
  if (h.reason === 'out') return [ICON_STEP, '문 밖으로 나왔어요.', '도착하면 아래 버튼을 눌러요.'];
  if (h.reason === 'burden') return [ICON_STEP, '오늘은 10분만 하고 와요.', '10분만 해도 출석은 똑같이 한 칸이에요.'];
  if (h.reason === 'tired') return [ICON_STEP, '오늘은 가볍게만 하고 와요.', '걷기만 하고 와도 출석이에요.'];
  if (h.reason === 'later' && h.planTime) {
    return [ICON_CLOCK, planLabel(h.planTime) + '에 가기로 했어요.',
      planPassed(h.planTime) ? '시간이 됐어요. 운동복부터 입어볼까요?' : '그 시간이 되면 운동복부터 입어요.'];
  }
  return null;
}

function btn(cls, text, fn) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls;
  b.textContent = text;
  b.addEventListener('click', (e) => { if (!b.dataset.cancel) fn(e); });
  return b;
}
// 진동이 필요한 버튼: 버튼 모양의 label 안에 실제 스위치를 깔아 둠
function hapBtn(cls, text, fn) {
  const l = document.createElement('label');
  l.className = 'btn hapbtn ' + cls;
  const span = document.createElement('span');
  span.textContent = text;
  const input = document.createElement('input');
  input.type = 'checkbox';
  input.setAttribute('switch', '');
  input.className = 'hap';
  input.setAttribute('aria-label', text);
  let fired = false;
  input.addEventListener('change', () => {
    if (l.dataset.cancel) { input.checked = !input.checked; return; }
    if (fired) return;
    fired = true;
    haptic();
    fn();
  });
  l.append(span, input);
  return l;
}
function stateBlock(icon, iconCls, title, sub, animate) {
  const el = $('state');
  el.innerHTML = '';
  if (!icon) return;
  let mark;
  if (typeof icon === 'string') {
    mark = document.createElement('div');
    mark.className = 'mark ' + iconCls + (animate ? ' pop' : '');
    mark.innerHTML = icon;
  } else {
    mark = icon;
  }
  const h = document.createElement('h2'); h.textContent = title;
  const p = document.createElement('p'); p.textContent = sub;
  el.append(mark, h, p);
}
// 기분을 날씨로: 나쁨=비, 별로=흐림, 보통=구름 사이 해, 좋음=해, 매우 좋음=빛나는 해
const WX_NAME = ['비', '흐림', '구름 조금', '맑음', '아주 맑음'];
function wxRays(cx, cy, r1, r2, n) {
  let out = '';
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    out += '<line class="wx-ray" x1="' + (cx + Math.cos(a) * r1).toFixed(1) + '" y1="' + (cy + Math.sin(a) * r1).toFixed(1) +
      '" x2="' + (cx + Math.cos(a) * r2).toFixed(1) + '" y2="' + (cy + Math.sin(a) * r2).toFixed(1) + '"/>';
  }
  return out;
}
function cloud(cls, dx, dy, s) {
  return '<g transform="translate(' + dx + ' ' + dy + ') scale(' + s + ')"><g class="wx-cloud ' + cls + '">' +
    '<circle cx="46" cy="62" r="15"/><circle cx="64" cy="52" r="20"/><circle cx="82" cy="64" r="13"/>' +
    '<rect x="32" y="60" width="62" height="19" rx="9.5"/></g></g>';
}

// 기록 화면의 누적 칸 중 지금 줄(10칸)을 그대로 보여줌. 오늘 칸만 톡 하고 채워짐
function cellStrip(n, animate) {
  const strip = document.createElement('div');
  strip.className = 'strip';
  strip.setAttribute('role', 'img');
  strip.setAttribute('aria-label', n + '번째 출석 칸이 채워졌어요');
  const filled = ((n - 1) % 10) + 1;
  const att = attendDays();
  const start = att.length - filled;
  for (let i = 0; i < 10; i++) {
    const c = document.createElement('i');
    if (i < filled) {
      const r = state.records[att[start + i]] || {};
      c.className = 'on' + (r.reluctant ? ' tough' : '') + (animate && i === filled - 1 ? ' new' : '');
      if (r.reluctant) c.style.setProperty('--d', ((i * 0.9) % 7).toFixed(1) + 's');
    }
    strip.append(c);
  }
  return strip;
}

function renderToday(animate) {
  const now = new Date();
  $('today-date').textContent = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
  $('goal-name').textContent = state.goal;
  const n = attendCount();
  $('today-count').innerHTML = n + '<small>회</small>';
  // 과거의 나: 쓸 수 있는 문장 중 하루에 하나씩 돌아가며 보여줌
  const lines = pastLines();
  const dayIdx = Math.floor(new Date(todayKey()).getTime() / 864e5);
  const gap = gapToday();
  const k = activeKey();
  const line = gap ? '오늘 가면 ' + gap + '일 만에 다시 시작하는 거예요.' : (lines.length ? lines[dayIdx % lines.length] : '');
  $('reluctant-line').hidden = !line;
  $('reluctant-line').textContent = line;

  const r = state.records[k];

  if (!r) {

    box.append(hapBtn('primary', '도착했어요', () => actions.arrive(false)));
    if (!view) box.append(hapBtn('secondary', '가기 싫었는데 왔어요', () => actions.arrive(true)));
    const row = document.createElement('div');
    row.className = 'textrow';
    row.append(btn('text', view ? '다른 방법 볼래요' : '가기 싫어요', openHelp), btn('text', '오늘은 쉬기', () => actions.rest()));
    box.append(row);
  } else if (r.status === 'rest') {
    stateBlock(ICON_MOON, 'rest', '오늘은 쉬어요.', '지금까지의 기록은 그대로예요.', animate);

  } else if (!r.finishedAt) {

      (cbToday ? cbToday.days + '일 만에 다시 시작했어요' : timeOf(r.arrivedAt) + ' 도착') + ' · ' + n + '번째 출석', animate);
    box.append(
      hapBtn('primary', '운동 끝났어요', () => actions.finish(k)),
      btn('text', '도착 취소', () => actions.clearToday('도착 기록을 지웠어요', k))
    );

      timeOf(r.arrivedAt) + ' – ' + timeOf(r.finishedAt) + ' · 운동 ' + duration(r.arrivedAt, r.finishedAt), animate);

      b.setAttribute('aria-pressed', r.mood === i + 1 ? 'true' : 'false');
      moods.append(b);

    else $('state').append(el('p', 'mood-note', '기분 기록은 선택 사항이에요.'));
    box.append(btn('text', '끝 기록 취소', () => actions.unfinish(k)));

// ---- 오늘의 마무리 (기분을 고른 뒤) ----
const BEFORE = { out: '나가기 싫었어요', burden: '부담스러웠어요', tired: '피곤했어요', later: '미루고 싶었어요' };
function moodMessage(r) {
  // 기분이 나빴다고 해도 좋은 쪽으로 유도하지 않는다
  if (r.mood >= 4 && r.reluctant) return '가기 싫었는데 다녀오니 좋았네요. 다음에 가기 싫을 때 오늘을 보여 드릴게요.';
  if (r.mood >= 4) return '기분 좋았던 날로 남겨 둘게요.';
  if (r.mood === 3) return '보통인 날도 똑같이 한 칸이에요.';
  return '힘든 날이었네요. 그래도 오늘 한 칸은 그대로 쌓였어요.';
}
function wrapCard(r, h, k) {
  const card = el('div', 'wrap pop');
  if (r.reluctant) {
    const row = el('div', 'ba');
    const before = el('div', 'ba-item');
    before.append(el('span', 'ba-label', '출발 전'), el('span', 'ba-val', (h && BEFORE[h.reason]) || '가기 싫었어요'));
    const after = el('div', 'ba-item');
    after.append(el('span', 'ba-label', '다녀온 뒤'), el('span', 'ba-val on', MOODS[r.mood - 1]));
    row.append(before, el('span', 'ba-arrow', '→'), after);
    card.append(row);
  }
  card.append(el('p', 'wrap-msg', moodMessage(r)));
  const now = new Date();
  const y = +k.slice(0, 4), m = +k.slice(5, 7) - 1;
  const sameMonth = y === now.getFullYear() && m === now.getMonth();
  const stats = [(sameMonth ? '이번 달 ' : (m + 1) + '월 ') + monthCount(y, m) + '번째 출석'];
  if (r.mood >= 4) stats.push('기분 좋았던 날 ' + recs().filter(([, x]) => x.status === 'attend' && x.mood >= 4).length + '번째');
  else stats.push('지금까지 ' + attendCount() + '회');
  card.append(el('p', 'wrap-stat', stats.join(' · ')));
  return card;
}

// ---- 가기 싫을 때 도움 ----
function defaultPlanTime() {
  const d = new Date(Date.now() + 3600e3);
  let t = Math.ceil((d.getHours() * 60 + d.getMinutes()) / 30) * 30;
  if (d.getDate() !== new Date().getDate() || t >= 1440) t = 1410;
  return pad(Math.floor(t / 60)) + ':' + pad(t % 60);
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}
function helpAsk(reason) {
  state.help[todayKey()] = { reason, step: 'asked', at: Date.now() };
  save();
  renderHelp();
}
function helpStep(step) {
  const h = state.help[todayKey()];
  if (h) { h.step = step; save(); }
  renderHelp();
}
let helpReason = null;
function helpCommit(extra) {
  closeSheets();
  change((k) => {
    state.help[k] = Object.assign(state.help[k] || { reason: helpReason, at: Date.now() }, extra || {}, { step: 'committed' });
  }, null);
}
function renderHelp(forceAsk) {
  const body = $('help-body');
  body.innerHTML = '';
  const h = state.help[todayKey()];
  const footer = el('div', 'btns help-foot');

  if (forceAsk || !h || h.step === 'committed') {
    body.append(el('h2', '', '지금 뭐가 제일 어려워요?'));
    body.firstChild.id = 'help-title';
    const opts = el('div', 'btns');
    for (const [key, v] of Object.entries(REASONS)) opts.append(btn('plain opt', v.ask, () => helpAsk(key)));
    body.append(opts);
    footer.append(btn('text', '닫기', closeSheets));
    body.append(footer);
    return;
  }

  helpReason = h.reason;
  let title, sub, main;
  const extra = [];
  if (h.reason === 'out' && h.step !== 'clothes') {
    title = '운동복만 입어볼까요?';
    sub = '입고 나서도 싫으면 그때 쉬어도 돼요.';
    main = btn('primary', '운동복 입었어요', () => helpStep('clothes'));
  } else if (h.reason === 'out') {
    title = '신발 신고 문 밖으로만 나가 볼까요?';
    sub = '그다음은 나가서 생각해요.';
    main = btn('primary', '나왔어요', () => helpCommit());
  } else if (h.reason === 'burden') {
    title = '오늘은 10분만 하고 와도 돼요.';
    sub = '10분만 해도 출석은 똑같이 한 칸이에요.';
    main = btn('primary', '10분만 하고 올게요', () => helpCommit());
  } else if (h.reason === 'tired') {
    title = '가볍게 걷기만 하고 와도 돼요.';
    sub = '정말 지쳤다면 오늘은 쉬어도 괜찮아요.';
    main = btn('primary', '가볍게만 할게요', () => helpCommit());
    extra.push(btn('plain', '오늘은 쉴게요', () => { closeSheets(); actions.rest(); }));
  } else {
    title = '몇 시에 갈래요?';
    sub = '시간을 정해 두면 시작하기가 쉬워져요.';
    const field = el('div', 'field help-time');
    const input = el('input');
    input.type = 'time';
    input.id = 'plan-time';
    input.value = h.planTime || defaultPlanTime();
    input.setAttribute('aria-label', '갈 시간');
    field.append(input);
    extra.unshift(field);
    main = btn('primary', '이 시간에 갈게요', () => {
      const v = $('plan-time').value;
      if (!/^\d{2}:\d{2}$/.test(v)) { toast('시간을 골라 주세요'); return; }
      helpCommit({ planTime: v });
    });
  }

  const h2 = el('h2', '', title);
  h2.id = 'help-title';
  body.append(h2, el('p', 'lead', sub));
  const lines = pastLines(h.reason).slice(0, 2);
  if (lines.length) {
    const card = el('div', 'evidence');
    lines.forEach((t) => card.append(el('p', '', t)));
    body.append(card);
  }
  const btns = el('div', 'btns help-main');
  extra.filter((x) => x.classList.contains('field')).forEach((x) => body.append(x));
  btns.append(main);
  extra.filter((x) => !x.classList.contains('field')).forEach((x) => btns.append(x));
  body.append(btns);
  footer.append(btn('text', '다른 이유예요', () => renderHelp(true)), btn('text', '닫기', closeSheets));
  footer.className = 'textrow help-foot';
  body.append(footer);
}
function openHelp() {
  renderHelp();
  openSheetEl('help');
}

// 기록 화면
let calY, calM;
function chip(label, value) {

function renderRecord(animateNew) {

  for (let i = 0; i < first; i++) cal += '<div class="day blank"></div>';
  for (let d = 1; d <= days; d++) {

    if (k < tk) {

// ---- 쌓인 칸: 한 칸 = 간 하루. 누르면 그날 기록을 보여줌 ----
// 설명 문구 없이 알 수 있게: 처음엔 가장 최근 칸이 골라져 있고, 아래에 그날 기록이 보인다.
// 칸 하나 = 간 하루라는 걸 예시로 보여 주고, 반짝이는 칸은 눌러 보면 무슨 날인지 나온다.
let selectedCell = null;
function dayLabel(k) {
  return new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, +k.slice(8, 10))
    .toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
}
function renderCells(animateNew) {
  const att = attendDays();
  const n = att.length;
  const tk = todayKey();
  if (!att.includes(selectedCell)) selectedCell = n ? att[n - 1] : null;
  const box = $('cells');
  box.innerHTML = '';
  // 지금 줄의 남은 칸까지만 빈칸으로 (꽉 찼다면 다음 줄 하나)
  const total = Math.max(10, Math.ceil((n + 1) / 10) * 10);
  for (let i = 0; i < total; i++) {
    if (i >= n) { box.append(el('span', i === n ? 'cell next' : 'cell')); continue; }
    const k = att[i];
    const r = state.records[k];
    const b = document.createElement('button');
    b.className = 'cell on' + (r.reluctant ? ' tough' : '') + (k === selectedCell ? ' sel' : '') +
      (animateNew && k === tk && i === n - 1 ? ' new' : '');
    if (r.reluctant) b.style.setProperty('--d', ((i * 0.9) % 7).toFixed(1) + 's');
    b.setAttribute('aria-label', (i + 1) + '번째 칸, ' + dayLabel(k) + (r.reluctant ? ', 가기 싫었는데 간 날' : ''));
    b.addEventListener('click', () => {
      if (b.dataset.cancel) return;
      if (selectedCell === k) return;
      selectedCell = k;
      renderCells(false);
    });
    box.append(b);
  }
  renderCellDetail(att);
}
function renderCellDetail(att) {
  const box = $('cell-detail');
  box.innerHTML = '';
  box.hidden = !selectedCell;
  if (!selectedCell) return;
  const k = selectedCell;
  box.append(el('p', 'cd-title', (att.indexOf(k) + 1) + '번째 칸 · ' + dayLabel(k)));
  dayFacts(k).forEach((t) => box.append(el('p', 'cd-line', t)));
}
// 간 날의 기록을 문장으로 (칸 상세·달력 상세가 함께 씀)
function dayFacts(k) {
  const r = state.records[k];
  const h = state.help[k];
  const facts = [];
  if (r.arrivedAt > 1e11) {
    facts.push(timeOf(r.arrivedAt) + ' 도착' + (r.finishedAt > r.arrivedAt ? ' · 운동 ' + duration(r.arrivedAt, r.finishedAt) : ''));
  }
  if (r.reluctant) facts.push('가기 싫었는데 간 날' + (h && BEFORE[h.reason] ? ' (' + BEFORE[h.reason].replace(/어요$/, '음') + ')' : ''));
  const cb = comebacks().find((x) => x.key === k);
  if (cb) facts.push(cb.days + '일 만에 다시 시작한 날');
  if (r.mood) facts.push('다녀온 뒤 기분: ' + MOODS[r.mood - 1]);
  if (r.late) facts.push('나중에 추가한 기록');
  if (!facts.length) facts.push('도착한 날');
  return facts;
}

// ---- 지난 날 기록 고치기 (달력에서 날짜를 누르면) ----
// 깜빡하고 못 남긴 날을 채우거나, 잘못 남긴 날을 지울 수 있다. 오늘 기록은 '오늘' 탭에서만 바꾼다.
let selectedDay = null;
function renderDayDetail() {
  const box = $('day-detail');
  box.innerHTML = '';
  const tk = todayKey();
  if (selectedDay && !(selectedDay < tk)) selectedDay = null;
  box.hidden = !selectedDay;
  if (!selectedDay) return;
  const k = selectedDay;
  const r = state.records[k];
  box.append(el('p', 'cd-title', dayLabel(k)));
  if (!r) {
    box.append(el('p', 'cd-hint', '이 날은 기록이 없어요.'));
    box.append(btn('secondary', '이 날 다녀왔어요', () => change((key) => {
      state.records[key] = { status: 'attend', late: true };
    }, null, false, k)));
  } else {
    if (r.status === 'attend') dayFacts(k).forEach((t) => box.append(el('p', 'cd-line', t)));
    else {
      box.append(el('p', 'cd-line', '쉬기로 한 날'));
      box.append(btn('secondary', '이 날 다녀왔어요', () => change((key) => {
        state.records[key] = { status: 'attend', late: true };
      }, null, false, k)));
    }
    box.append(btn('text', '이 날 기록 지우기', () => change((key) => {
      delete state.records[key];
    }, '이 날 기록을 지웠어요', false, k)));
  }
}

function renderComeback() {
  const box = $('comeback');
  box.innerHTML = '';
  const cb = comebackStats();
  const gap = gapToday();
  const line = (t, cls) => box.append(el('p', cls || 'cb-line', t));

  if (cb.compare && cb.compare.better) {
    // 나아졌을 때만 그때의 나와 지금의 나를 나란히 보여줌
    line('다시 시작하는 데 걸리는 시간이 줄었어요.', 'cb-title');
    const max = Math.max(cb.compare.before, cb.compare.now);
    [['그때의 나', cb.compare.before, ''], ['지금의 나', cb.compare.now, 'now']].forEach(([label, v, cls]) => {
      const row = el('div', 'cb-row ' + cls);
      const track = el('div', 'cb-track');
      const bar = el('div', 'cb-bar');
      bar.style.width = Math.max(6, (v / max) * 100) + '%';
      track.append(bar);
      row.append(el('span', '', label), track, el('b', '', '평균 ' + fmtDays(v)));
      box.append(row);
    });
    line('처음 ' + cb.compare.k + '번과 최근 ' + cb.compare.k + '번, 쉬었다가 다시 간 날을 비교했어요.', 'cb-hint');
  } else if (cb.list.length) {
    // 비교할 만큼 쌓이지 않았거나 나아지지 않았을 때: 사실만 보여줌
    line('지난번엔 ' + cb.last.days + '일 만에 다시 갔어요.');
    if (cb.list.length >= 2) line('가장 빨리 다시 시작한 건 ' + cb.fastest + '일 만이었어요.');
    if (gap) line('오늘 가면 ' + gap + '일 만이에요.', 'cb-line accent');
    if (!cb.compare) line('쉬었다가 다시 간 날이 4번 쌓이고 4주가 지나면, 그때의 나와 비교해 드릴게요.', 'cb-hint');
  } else {
    line('쉬었다가 다시 가면, 며칠 만에 돌아왔는지 여기에 쌓여요.');
    if (gap) line('오늘 가면 ' + gap + '일 만이에요.', 'cb-line accent');
  }
}

$('cal').addEventListener('click', (e) => {
  const b = e.target.closest('button.day');
  if (!b || b.dataset.cancel) return;
  selectedDay = selectedDay === b.dataset.k ? null : b.dataset.k;
  renderRecord();
});
$('cal-prev').addEventListener('click', () => { selectedDay = null; calM--; if (calM < 0) { calM = 11; calY--; } renderRecord(); });
$('cal-next').addEventListener('click', () => { selectedDay = null; calM++; if (calM > 11) { calM = 0; calY++; } renderRecord(); });

function render(animate) { renderToday(animate); renderRecord(animate); }

// 탭
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === t.dataset.view));
  document.querySelector('main').scrollTop = 0;
}));

// 설정 시트
let wipeArmed = false;
function openSheet() {
  $('goal-input').value = state.goal;
  $('export-fallback').hidden = true;
  wipeArmed = false;
  $('wipe').textContent = '모든 기록 지우기';
  openSheetEl('sheet');
}
function openSheetEl(id) {
  $('scrim').classList.add('open');
  $(id).classList.add('open');
}
function closeSheets() {
  $('scrim').classList.remove('open');
  document.querySelectorAll('.sheet').forEach((s) => s.classList.remove('open'));
}
const closeSheet = closeSheets;
$('open-settings').addEventListener('click', openSheet);
$('close-settings').addEventListener('click', closeSheets);
$('scrim').addEventListener('click', closeSheets);

function saveGoal(e) {
  if (e) e.preventDefault();
  const v = $('goal-input').value.trim();
  if (!v) { toast('목표 이름을 적어 주세요'); return; }
  const before = state.goal;
  state.goal = v; save(); render();
  $('goal-input').blur();
  toast('목표 이름을 바꿨어요', () => { state.goal = before; save(); render(); });
}
$('goal-form').addEventListener('submit', saveGoal);
$('goal-save').addEventListener('click', saveGoal);

function backupName() { return 'become-backup-' + todayKey() + '.json'; }
async function exportBackup() {
  const json = JSON.stringify(state, null, 2);
  const done = () => { state.lastBackup = Date.now(); save(); render(); toast('백업 파일을 만들었어요'); };
  try {
    const file = new File([json], backupName(), { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
      done();
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = backupName();
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {}
  // 다운로드가 막힌 환경에서도 복사로 백업할 수 있게
  $('export-text').value = json;
  $('export-fallback').hidden = false;
}
$('export').addEventListener('click', exportBackup);
$('backup-now').addEventListener('click', () => { openSheet(); exportBackup(); });
$('copy-export').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('export-text').value); state.lastBackup = Date.now(); save(); render(); toast('복사했어요. 메모 앱에 붙여넣어 두세요'); }
  catch (e) { $('export-text').select(); toast('길게 눌러서 직접 복사해 주세요'); }
});

$('import').addEventListener('click', () => $('import-file').click());
$('import-file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || typeof d.records !== 'object' || Array.isArray(d.records)) throw new Error('bad');
    const isDay = (k) => /^\d{4}-\d{2}-\d{2}$/.test(k);
    const clean = {};
    for (const [k, r] of Object.entries(d.records)) {
      if (isDay(k) && r && (r.status === 'attend' || r.status === 'rest')) {
        if (r.mood !== undefined && !(Number.isInteger(r.mood) && r.mood >= 1 && r.mood <= 5)) delete r.mood;
        clean[k] = r;
      }
    }
    const help = {};
    if (d.help && typeof d.help === 'object') {
      for (const [k, h] of Object.entries(d.help)) {
        if (isDay(k) && h && Object.prototype.hasOwnProperty.call(REASONS, h.reason)) help[k] = h;
      }
    }
    const before = state;
    state = Object.assign(fresh(), { goal: typeof d.goal === 'string' && d.goal.trim() ? d.goal.slice(0, 30) : before.goal, records: clean, help, lastBackup: Date.now() });
    save(); render(); closeSheet();
    toast('기록 ' + Object.keys(clean).length + '개를 불러왔어요', () => { state = before; save(); render(); });
  } catch (err) {
    toast('이 파일은 불러올 수 없어요');
  }
});

$('wipe').addEventListener('click', () => {
  if (!wipeArmed) { wipeArmed = true; $('wipe').textContent = '한 번 더 누르면 모두 지워져요'; return; }
  const before = state;
  state = fresh(); save(); render(); closeSheet();
  toast('모든 기록을 지웠어요', () => { state = before; save(); render(); });
});

['gesturestart', 'gesturechange', 'gestureend'].forEach((t) =>
  document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// 버튼을 누른 채 손가락을 움직였다가 떼면 누르기를 취소
{
  const SEL = '.btn, .mood, .tab, .iconbtn, #toast-undo, .cal-nav button, button.cell, button.day';
  let target = null, sx = 0, sy = 0;
  document.addEventListener('touchstart', (e) => {
    const t = e.target.closest ? e.target.closest(SEL) : null;
    target = t && e.touches.length === 1 ? t : null;
    if (!target) return;
    delete target.dataset.cancel;
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
  }, { passive: true, capture: true });
  document.addEventListener('touchmove', (e) => {
    if (!target || target.dataset.cancel) return;
    const p = e.touches[0];
    if (Math.hypot(p.clientX - sx, p.clientY - sy) > 10) target.dataset.cancel = '1';
  }, { passive: true, capture: true });
  document.addEventListener('touchend', (e) => {
    if (!target) return;
    const t = target;
    target = null;
    if (t.dataset.cancel) {
      if (e.cancelable) e.preventDefault(); // 클릭이 만들어지지 않게
      setTimeout(() => { delete t.dataset.cancel; }, 400);
    }
  }, { passive: false, capture: true });
  // 그래도 클릭이 들어오면 여기서 막음 (스위치가 켜지는 것까지 막힘)
  document.addEventListener('click', (e) => {
    const t = e.target.closest ? e.target.closest(SEL) : null;
    if (t && t.dataset.cancel) { e.preventDefault(); e.stopPropagation(); }
  }, true);
}

// 날짜가 바뀌었을 수 있으니 앱으로 돌아올 때마다 다시 그림
document.addEventListener('visibilitychange', () => { if (!document.hidden) render(); });
// 앱을 켜 둔 채 자정(그리고 자정 넘겨 운동하던 기록이 끝나는 시각)이 지나도 화면이 바뀌게
let dayKeyShown = null;
setInterval(() => {
  const now = todayKey() + '|' + activeKey();
  if (dayKeyShown && now !== dayKeyShown) render();
  dayKeyShown = now;
}, 30000);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();
}
</script>
